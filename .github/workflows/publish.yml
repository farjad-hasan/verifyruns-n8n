# Publishes on version tags. Provenance requires the repo to be public; the first
# publish authenticates with the NPM_TOKEN secret, after which the package can switch
# to npm trusted publishing (then node-version must be >=22.14 and npm >=11.5.1).
name: publish
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

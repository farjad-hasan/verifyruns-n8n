# Publishes on version tags via npm trusted publishing (GitHub OIDC — no token).
# Configured on npm 2026-08-31: publisher farjad-hasan/verifyruns-n8n@publish.yml,
# 2FA required, bypass tokens disallowed. Trusted publishing needs npm >=11.5.1,
# hence the npm upgrade step (Node 22 bundles npm 10).
name: publish
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      # devDeps pull in native modules (isolated-vm via n8n-workflow) that our
      # zero-runtime-dep package never executes; skip their build scripts.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm publish --provenance --access public
